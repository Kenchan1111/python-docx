# ===========================================================================
# NOUVEAUX PATTERNS observés en Ch.G (à ajouter au catalogue global)
# ===========================================================================
new_patterns_to_add:

  TECH_SECTION_HEADER:
    description: "Sous-section technique dans le corps (pas dans annexe) — triple format"
    primary_signal: "Normal + [b,color,i] (3 formats combinés)"
    examples_in_G: [216]
    notes: "Equivalent fonctionnel d'ANNEX_SECTION_HEADER de Ch.A mais hors annexe"
    csc_action: "KEEP"

  TEXT_SUB_TITLE:
    description: "Titre de sous-section écrit en formatage Normal+gras+couleur (pas de style Heading)"
    primary_signal: "Normal + [b,color] (souvent en MAJUSCULES ou casse mixte)"
    examples_in_G: [0, 125]
    notes: "Peut compenser l'absence de style Heading approprié. Souvent contient une numérotation (G. 1.2.7.6.)"
    csc_action: "KEEP"

  CSC_CONTENT_TO_INSERT:
    description: "Texte conditionnel à insérer après un META_COMMENT annonciateur"
    primary_signal: "Suit immédiatement un META_COMMENT du type 'En cas de X, introduire le texte suivant:' — souvent en [color] aussi (héritage visuel)"
    examples_in_G: [224]  # précédé par idx 223 [color] "En cas de raclage-pose, introduire le texte suivant:"
    notes: "Polysémie color : même formatage que le META qui l'introduit, mais c'est du CONTENU à inclure si la condition est vraie"
    csc_action: "KEEP_IF_CONDITION"

  GROUPED_LEGAL_REMINDER:
    description: "Bloc de plusieurs paragraphes consécutifs en [color,i] formant un rappel multi-paragraphes"
    primary_signal: "≥3 paragraphes consécutifs Normal [color,i] sans break Heading entre"
    examples_in_G: [["218","219","220","221"], ["372","373","374","375"], ["404","405"], ["413","414","416","417"]]
    notes: "À détecter par REGROUPEMENT — pas paragraphe par paragraphe. Tous = LEGAL_REMINDER"
    csc_action: "REMOVE (tout le groupe)"

  META_COMMENT_IN_PUCES:
    description: "META_COMMENT hébergé dans un style de liste à puces"
    primary_signal: "style ∈ {Puces 1, Puces 2} + incipit méta ('Indiquer', 'Préciser', 'Spécifier', 'Mentionner')"
    examples_in_G: [17, 18, 19, 26, 27, 28, 38, 39, 68, 69, 149, 150, 167, 168, 169, 240, 283, 295, 296, 392, 393, 394, 431]
    notes: "POLYSÉMIE du style Puces: peut être LIST_ITEM normal OU META_COMMENT. Désambiguïsation par incipit textuel."
    csc_action: "REMOVE"
    new_meta_incipits_for_G: ["Spécifier", "Mentionner"]

