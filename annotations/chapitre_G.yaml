# ===========================================================================
# IMPLICATIONS POUR LES HEURISTIQUES (v2 cross-chapter)
# ===========================================================================
implications_for_heuristics:

  style_aliases_required:
    headings: ["CSC Titre 1|2|3", "Heading 1|2|3|4|5", "Titre 1|2|3"]
    list_items: ["Liste à puces", "Liste à puces 2", "Puces 1", "Puces 2", "retrait puce 1", "Retrait corps de texte 2|3", "Paragraphe de liste"]
    body_alt: ["Body Text", "Body Text Indent", "Corps de texte 3", "Retrait corps de texte 2|3"]

  signal_priority_per_chapter:
    description: "Le signal méta primaire varie entre chapitres. L'heuristique doit checker LES DEUX (italique OU couleur) avec un poids égal."
    implementation: "Au lieu de 'IF italic THEN meta', faire 'IF italic OR color THEN meta_candidate, then apply incipit test'"

  meta_incipits_expanded:
    add_to_global_list:
      - "^Spécifier\\b"        # vu massivement dans Ch.G
      - "^Mentionner\\b"        # idem
      - "^A défaut\\b"
      - "^Eventuellement\\b"
      - "^Le cas échéant, "    # variante avec virgule
      - "^Au cas où"
      - "^Pour les chantiers de"
      - "^Pour le réseau "      # spécifique routes
      - "^Dans le cas où"

  grouping_required:
    description: "Certains patterns (GROUPED_LEGAL_REMINDER, CONDITIONAL_BLOCK) ne se détectent qu'en regroupant les paragraphes consécutifs"
    rule: "Après classification individuelle, faire une 2e passe pour regrouper N consécutifs de même type (color uniforme, italique uniforme)"

  contextual_disambiguation:
    description: "Polysémie style Puces 1/2 : LIST_ITEM ou META_COMMENT selon contexte"
    rule: "Style=Puces + texte commence par incipit méta → META_COMMENT (priorité haute). Sinon LIST_ITEM."

  meta_to_content_pattern:
    description: "META_COMMENT du type 'introduire le texte suivant:' annonce un CSC_CONTENT_TO_INSERT au paragraphe suivant"
    rule: "Détection 2-pass : si paragraphe N est META_COMMENT avec ce pattern, marquer paragraphe N+1 (et suivants jusqu'à break) comme CSC_CONTENT_TO_INSERT"

