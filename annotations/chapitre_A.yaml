# ---------------------------------------------------------------------------
# Observations méthodologiques pour la suite
# ---------------------------------------------------------------------------
observations:
  - "Italique non systématique pour META_COMMENT : incipits sémantiques sont signal complémentaire requis"
  - "Souligné seul = CHOICE_HEADER (variantes mutuellement exclusives)"
  - "Gras+souligné = STRUCTURE_HEADER (sous-section qui reste dans le CSC final, ≠ choix variantes)"
  - "Color sur run = emphase éditoriale, à investiguer (idx 110)"
  - "Placeholders : '…' explicite OU sémantique (Code postal et Commune)"
  - "variant_group/variant_id permettent de tracer les variantes mutuellement exclusives"
  - "Item de checklist (préfixe '-') peut être CHOICE_ITEM ou META_COMMENT selon le contexte parent"
  - "Incipits méta récurrents : 'Indiquer', 'Si...', 'Selon l'hypothèse', 'Le cas échéant', 'Pour les...', 'Ajouter...'"

incipit_patterns_so_far:
  - "^Indiquer\\b"
  - "^Selon l'hypothèse"
  - "^Le cas échéant"
  - "^Pour les "
  - "^Ajouter "
  - "^Si .{1,80}, "          # Si <condition>, <action>
  - "^Il est rappelé"
  - "adapter le canevas\\.?$"
  - "^Préciser\\b"
  - "^Supprimer\\b"
  - "^En cas de "
  - "^En fonction du "
  - "^A défaut\\b"
  - "^Exemple\\s*:"
  - "^Exemples\\b"
  - "^NB\\s*:"
  - "^Note\\s*:"
  - "^S'il échet"
  - "^Définir\\b"
  - "^Enumérer\\b"

# ===========================================================================
# CATALOGUE CONSOLIDÉ — tous les TYPES observés sur Ch.A (1208 paragraphes)
# Chaque type liste son SIGNAL primaire + exemples (idx) trouvés
# ===========================================================================
patterns_catalog:

  SECTION_TITLE:
    description: "Titre de section ou sous-section, structure le chapitre"
    primary_signal: "style=CSC Titre 1/2/3"
    secondary_signal: "OU style=Heading 1/2/3 (variantes legacy)"
    examples: [6, 45, 46, 102, 121, 251, 354, 357, 412, 460, 575, 579, 649, 787]
    csc_action: "KEEP (titre conservé, peut être renommé)"

  STRUCTURE_HEADER:
    description: "Sous-titre normatif qui reste dans le CSC final"
    primary_signal: "style=Normal + gras+souligné [b,u]"
    secondary_signal: "OU style=Normal + souligné [u] dans contexte sous-section CSC Titre 3 (a/b/c)"
    examples: [8, 12, 18, 359, 367, 371, 1083, 1090]
    csc_action: "KEEP"
    notes: "À distinguer de CHOICE_HEADER : ici les sous-titres COEXISTENT (ils ne s'excluent pas)"

  CHOICE_HEADER:
    description: "Entête de variante mutuellement exclusive — le rédacteur en choisit UNE et supprime les autres"
    primary_signal: "style=Normal + souligné [u] dans contexte de meta_comment annonciateur"
    secondary_signal: "Pattern textuel 'X: variante1', 'Hypothèse N:', 'Pouvoir adjudicateur: Y'"
    examples: [52, 64, 80, 98, 411, 419, 605, 615]
    csc_action: "KEEP_ONE_OF (élagage : garder une variante, supprimer les autres)"

  CHOICE_ITEM:
    description: "Item d'une liste de choix simples (puce ou tiret)"
    primary_signal: "Préfixe '- ' ou '-soit ' après un META_COMMENT annonciateur"
    secondary_signal: "Souvent en italique si le bloc parent l'est"
    examples: [274, 275, 276, 277, 1086, 1087, 802, 803]
    csc_action: "KEEP_ONE_OR_MORE"

  CHOICE_SEPARATOR:
    description: "Mot 'Ou' / 'ou' isolé entre deux alternatives"
    primary_signal: "Paragraphe contenant uniquement 'Ou' / 'ou' (parfois italique)"
    examples: [558, 629]
    csc_action: "REMOVE (avec une des deux alternatives)"

  META_COMMENT:
    description: "Instruction au rédacteur sur quoi mettre — N'apparaît PAS dans le CSC final"
    primary_signal: "Run italique [i] + incipit sémantique"
    secondary_signal: "OU style=Body Text + incipit OU incipit textuel seul si italique perdu"
    examples: [48, 50, 100, 107, 123, 255, 263, 272, 280, 285, 363, 407, 521, 522, 524, 565, 581, 794, 800]
    csc_action: "REMOVE"
    incipits: ["Indiquer", "Préciser", "Si X,", "Pour les", "Selon l'hypothèse", "Le cas échéant", "A défaut", "Supprimer", "Ajouter", "En cas de", "En fonction de", "Définir", "Enumérer", "S'il échet"]

  LEGAL_REMINDER:
    description: "Rappel juridique au rédacteur (n'est pas une instruction d'action)"
    primary_signal: "Run italique [i] + incipit non impératif ('Il est rappelé', 'En règle générale', 'Pour mémoire', 'La durée totale...')"
    examples: [16, 287, 384, 386, 388, 390, 409, 622, 624, 645, 791, 798, 805, 965, 973, 996, 998, 1003, 1004]
    csc_action: "REMOVE"

  EXAMPLE_HEADER:
    description: "Annonce un bloc d'exemple/canevas reproductible"
    primary_signal: "italique+souligné [i,u] + texte 'Exemple:', 'Exemples de clauses:'"
    examples: [289, 309, 999]
    csc_action: "REMOVE (le header lui-même)"

  EXAMPLE_TEXT:
    description: "Texte d'exemple/canevas que le rédacteur copie et adapte (le bloc lui-même est gardé, l'italique enlevé)"
    primary_signal: "Bloc multi-paragraphes en italique après un EXAMPLE_HEADER"
    examples: [291, 293, 294, 296, 298, 311, 313, 314, 315, 317, 319, 320, 321, 323, 325, 326, 327]
    csc_action: "KEEP_AS_DRAFT (désitaliciser pour intégrer au CSC final)"
    notes: "Distinction critique avec META_COMMENT : EXAMPLE_TEXT est du contenu de référence, pas une instruction"

  CONDITIONAL_BLOCK:
    description: "Bloc de paragraphes dont le formatage couleur signale qu'ils sont conditionnels"
    primary_signal: "Run color [color] sur plusieurs paragraphes consécutifs"
    examples: [110, 162, 212, 214, 216, 218, 220, 222, 224, 226, 233, 235, 237, 239, 298, 842, 844, 1006]
    csc_action: "KEEP_IF_CONDITION (à élaguer si condition fausse)"
    notes: "La couleur signale visuellement au rédacteur 'ce bloc est conditionnel'. Souvent introduit par un META_COMMENT avec 'Si X' ou 'En cas de Y'"

  CSC_CONTENT:
    description: "Texte CSC standard à conserver tel quel (ou avec adaptations mineures)"
    primary_signal: "style=Normal sans formatage spécial, contenu narratif/juridique"
    secondary_signal: "OU style=Sans interligne / Paragraphe de liste pour items de listes légales"
    examples: [10, 20, 54, 105, 113, 115, 119, 131, 132, 188, 414, 422, 472, 490, 661, 691, 989]
    csc_action: "KEEP"

  INLINE_PLACEHOLDER:
