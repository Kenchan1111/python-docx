    primary_signal: "Présence de '…' (un ou plusieurs) dans le texte"
    secondary_signal: "OU '………..' / '....' (points multiples) OU '(à compléter)' / '(à définir)' / '(à décrire)'"
    examples: [56, 59, 60, 210, 307, 341, 342, 343, 344, 394, 609, 611, 682, 720, 994, 1133, 1136]
