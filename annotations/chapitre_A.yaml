# ===========================================================================
# HEURISTIQUES — règles candidates (v1) à implémenter dans tools/extract_questions.py
# Ordre = priorité (la première règle qui matche gagne)
# ===========================================================================
heuristics_v1:
  - rule_id: H01_section_title
    if: "style ∈ {CSC Titre 1, CSC Titre 2, CSC Titre 3, Heading 1, Heading 2, Heading 3}"
    then: SECTION_TITLE
    confidence: high

  - rule_id: H02_document_note
    if: "run_fmt has [i,u] AND text starts with /^Note\\s*:|^NB\\s*:/"
    then: DOCUMENT_NOTE
    confidence: high

  - rule_id: H03_example_header
    if: "run_fmt has [i,u] AND text starts with /^Exemple/i"
    then: EXAMPLE_HEADER
    confidence: high

  - rule_id: H04_annex_section_header
    if: "run_fmt has [b,i,color] (les 3 combinés)"
    then: ANNEX_SECTION_HEADER
    confidence: high

  - rule_id: H05_variant_block_header
    if: "style = Heading 9 AND run_fmt has [b]"
    then: VARIANT_BLOCK_HEADER
    confidence: high

  - rule_id: H06_structure_header
    if: "run_fmt has [b,u] AND style = Normal"
    then: STRUCTURE_HEADER
    confidence: high

  - rule_id: H07_enumerated_header
    if: "run_fmt has [u] AND text matches /^[a-z]\\)/ OR /^ARTICLE\\s+\\d+/"
    then: ENUMERATED_HEADER
    confidence: high

  - rule_id: H08_choice_header
    if: "run_fmt has [u] AND (text contains ':' OR matches Hypothèse/Pouvoir adjudicateur)"
    then: CHOICE_HEADER
    confidence: medium

  - rule_id: H09_choice_separator
    if: "text matches /^[Oo]u\\.?$/ (paragraphe = 'Ou' seul)"
    then: CHOICE_SEPARATOR
    confidence: high

  - rule_id: H10_empty_list_placeholder
    if: "text matches /^-\\s*$/"
    then: EMPTY_LIST_PLACEHOLDER
    confidence: high

  - rule_id: H11_meta_comment_italic
    if: "run_fmt has [i] AND incipit ∈ meta_incipits AND NOT inside example_block"
    then: META_COMMENT
    confidence: high

  - rule_id: H12_legal_reminder_italic
    if: "run_fmt has [i] AND incipit ∈ {Il est rappelé, En règle générale, Pour mémoire, La durée totale, ...}"
    then: LEGAL_REMINDER
    confidence: medium

  - rule_id: H13_example_text
    if: "run_fmt has [i] AND inside_example_block (préc. EXAMPLE_HEADER, mêmes runs italiques consécutifs)"
    then: EXAMPLE_TEXT
    confidence: medium

  - rule_id: H14_conditional_block
    if: "run_fmt has [color] (regrouper paragraphes consécutifs avec color)"
    then: CONDITIONAL_BLOCK
    confidence: medium

  - rule_id: H15_choice_item
    if: "text matches /^-\\s+/ OR /^-soit\\s+/ AND parent is META_COMMENT or CHOICE_HEADER"
    then: CHOICE_ITEM
    confidence: medium

  - rule_id: H16_meta_comment_bodytext
    if: "style = Body Text AND incipit ∈ meta_incipits"
    then: META_COMMENT
    confidence: medium

  - rule_id: H17_inline_placeholder
    if: "text contains '…' OR matches /(à compléter|à définir|à décrire|à lister)/"
    then: INLINE_PLACEHOLDER
    confidence: high

  - rule_id: H18_meta_comment_text_only
    if: "style = Normal AND incipit ∈ meta_incipits AND no other classification"
    then: META_COMMENT
    confidence: low
    notes: "Fallback pour les meta comments dont l'italique a été perdu"

  - rule_id: H19_list_item
    if: "style ∈ {Liste à puces, Liste à puces 2, retrait puce 1, Paragraphe de liste, Puces 1}"
    then: LIST_ITEM
    confidence: high

  - rule_id: H20_numbered_procedure
    if: "text matches /^\\d+\\)\\s+/"
    then: NUMBERED_PROCEDURE
    confidence: high

  - rule_id: H21_arrow_sub_action
    if: "text starts with '→'"
    then: ARROW_SUB_ACTION
    confidence: high

  - rule_id: H99_default
    if: "no rule matched"
    then: CSC_CONTENT
    confidence: low
