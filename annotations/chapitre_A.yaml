# Annotation manuelle Ch.A Qualiroutes — v1 (en cours)
# Méthodologie : lecture séquentielle, classification par TYPE + SIGNAL observé.
# Source : csc_samples/Chapitre A - modele.docx (après accept_all_revisions)
#
# Types utilisés :
#   SECTION_TITLE       — titre de section (style CSC Titre N)
#   META_COMMENT        — instruction au rédacteur (n'apparaît pas dans le CSC final)
#   STRUCTURE_HEADER    — sous-titre normatif (souligné/gras+souligné), reste dans le CSC
#   CHOICE_HEADER       — entête de variante mutuellement exclusive
#   CHOICE_ITEM         — item d'une liste de choix (préfixé "- ")
#   CSC_CONTENT         — texte CSC à conserver tel quel ou avec placeholders
#   INLINE_PLACEHOLDER  — texte CSC contenant des "…" à compléter
#   LEGAL_REF           — référence juridique stable (article X loi/ARP) — pas une question
#
# Pour chaque annotation :
#   idx       : index paragraphe (après accept_all_revisions)
#   type      : un des types ci-dessus
#   signal    : ce qui m'a fait classifier ainsi (sera entrée des heuristiques)
#   excerpt   : début du texte pour traçabilité
#   notes     : observations méthodologiques (sémantique, lien, etc.)

